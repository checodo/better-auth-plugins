# Releases with Changesets, split into jobs so that each one gets only the
# permissions it needs (the layout recommended by changesets.dev,
# "Automating Changesets > Trusted Publishing"):
#
# On every push to main:
#   select-mode  pending changesets?        -> version
#                unpublished versions?      -> pack -> publish -> release-assets, docs
#   version      opens or updates the "Version Packages" PR. It uses a
#                GitHub App token, not GITHUB_TOKEN, so CI runs on that PR.
#   pack         builds the packages and packs the tarballs (no secrets).
#   publish      publishes the tarballs to npm (environment `npm`, trusted
#                publishing with provenance), then creates the git tags and
#                GitHub releases. Only this job can get an npm OIDC token.
#   release-assets  attaches the published tarball, its CycloneDX SBOM,
#                and a signed Sigstore bundle (build provenance for both,
#                also stored as a GitHub attestation) to each new GitHub
#                release.
#   docs         deploys the docs (environment `docs`, Vercel deploy hook),
#                so the docs always show the latest published version.
#
# "Run workflow" (Actions > Release) on main publishes a canary: every
# package with a pending changeset as a snapshot under the npm tag `canary`
# (`0.2.0-canary-<datetime>`). No version commit, tags, or changelog.
#
# Never publish from a local machine: `npm publish` / `changeset publish`
# belong to this workflow only.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Reset; every job lists what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release halfway through.
  cancel-in-progress: false

jobs:
  select-mode:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in release jobs: a poisoned cache could
          # change what gets published.
          package-manager-cache: false

      # Only the Changesets CLI is needed: no install scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The GitHub App's credentials live in this environment.
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Only the Changesets CLI is needed. No install scripts in a job that
      # gets the GitHub App's key: a dependency's script could otherwise
      # tamper with node_modules before the App token is created.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # A PR opened with GITHUB_TOKEN gets no CI run (GitHub's rule against
      # loops), so the required `ci` check would never report. The App's
      # token doesn't have that limit.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the "Version Packages" PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing can't create a package: a package that isn't on
      # npm yet fails in the publish job with an unclear 404, possibly after
      # others were already published. Stop here instead, before anything
      # is published.
      - name: Check every package exists on npm
        run: |
          missing=false
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./$manifest').private === true")" = true ]; then continue; fi
            name=$(node -p "require('./$manifest').name")
            if ! npm view "$name" name > /dev/null 2>&1; then
              echo "::error::$name isn't on npm yet. Create it first: CONTRIBUTING.md, \"First publish of a new package\"."
              missing=true
            fi
          done
          [ "$missing" = false ]

      - name: Build packages
        run: pnpm turbo run build --filter=./packages/*

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

      # One SBOM per published package: its runtime dependencies, exactly
      # as the lockfile resolves them. The release-assets job attaches them
      # to the GitHub releases.
      - name: Generate SBOMs
        run: |
          mkdir -p sbom
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./$manifest').private === true")" = true ]; then continue; fi
            name=$(node -p "require('./$manifest').name")
            pnpm --filter "$name" sbom --sbom-format cyclonedx --prod > "sbom/${name#@checodo/}.cdx.json"
          done
          ls -l sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm's trusted publisher for each package names this workflow file and
    # this environment; the environment only allows runs on main.
    environment: npm
    permissions:
      contents: write # git tags and GitHub releases
      id-token: write # npm trusted publishing and provenance
    outputs:
      published: ${{ steps.publish.outputs.published }}
      published-packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Only the Changesets CLI is needed here; the tarballs come from the
      # pack job. No install scripts in the job that can get an npm token.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Trusted publishing only, no npm token: pnpm exchanges the job's OIDC
      # token with npm. Every package needs a trusted publisher before its
      # first release (CONTRIBUTING.md, "First publish of a new package").
      - name: Publish packages
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          # Trusted publishing adds provenance by itself; this makes it
          # explicit.
          PNPM_CONFIG_PROVENANCE: "true"

  release-assets:
    needs: [pack, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
      id-token: write # Sigstore signing of the attestation
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      # The exact tarballs the publish job sent to npm.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: pack

      - name: Collect the release assets
        env:
          PUBLISHED: ${{ needs.publish.outputs.published-packages }}
        run: |
          mkdir assets
          echo "$PUBLISHED" | jq -r '.[] | "\(.name) \(.version)"' | while read -r name version; do
            slug="${name#@checodo/}"
            tarball=$(find pack -type f -name "*${slug}-${version}.tgz" | head -n 1)
            if [ -z "$tarball" ]; then
              echo "::error::No tarball for $name@$version in the pack artifact."
              exit 1
            fi
            cp "$tarball" "assets/${slug}-${version}.tgz"
            cp "sbom/${slug}.cdx.json" "assets/${slug}-${version}.cdx.json"
          done
          ls -l assets

      # SLSA build provenance for every tarball and SBOM, signed with
      # Sigstore (keyless, the run's identity). Verify a download with
      # `gh attestation verify <file> --repo checodo/better-auth-plugins`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*

      # The Sigstore bundle goes next to the files it signs, so the
      # signature is on the release itself (OpenSSF Scorecard,
      # "Signed-Releases").
      - name: Attach the assets to the GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.publish.outputs.published-packages }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          echo "$PUBLISHED" | jq -r '.[] | "\(.name) \(.version)"' | while read -r name version; do
            slug="${name#@checodo/}"
            cp "$BUNDLE" "assets/${slug}-${version}.sigstore.json"
            gh release upload "${name}@${version}" \
              "assets/${slug}-${version}.tgz" \
              "assets/${slug}-${version}.cdx.json" \
              "assets/${slug}-${version}.sigstore.json" \
              --repo "$GITHUB_REPOSITORY" --clobber
          done

  docs:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: docs
    permissions: {}
    steps:
      # Until the Vercel project and its deploy hook exist, the release
      # skips the docs instead of failing.
      - name: Deploy the docs (Vercel deploy hook)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::No VERCEL_DEPLOY_HOOK in the docs environment: the docs were not deployed."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK" > /dev/null

  canary-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Canaries are published from main only."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # snapshot.useCalculatedVersion in .changeset/config.json: the base is
      # the next version (0.2.0-canary-...), not 0.0.0-canary-...
      - name: Version as canary snapshot
        run: pnpm changeset version --snapshot canary

      # Without pending changesets nothing changes, and `changeset publish`
      # would publish any version that isn't on npm yet under `canary`.
      # Publish only versions this run made.
      - name: Check that there is something to publish
        run: |
          found=false
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./$manifest').private === true")" = true ]; then continue; fi
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            case "$version" in
              *-canary-*)
                # Trusted publishing can't create a package.
                if ! npm view "$name" name > /dev/null 2>&1; then
                  echo "::error::$name isn't on npm yet. Create it first: CONTRIBUTING.md, \"First publish of a new package\"."
                  exit 1
                fi
                found=true; echo "$name@$version" ;;
              *)
                if ! npm view "$name@$version" version > /dev/null 2>&1; then
                  echo "::error::$name@$version has no pending changeset and isn't on npm. Release it normally first."
                  exit 1
                fi
                ;;
            esac
          done
          if [ "$found" != true ]; then
            echo "::error::No pending changesets: nothing to publish as canary."
            exit 1
          fi

      - name: Build packages
        run: pnpm turbo run build --filter=./packages/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-packages
          path: |
            packages/*/package.json
            packages/*/dist/
            packages/*/CHANGELOG.md
          retention-days: 1
          if-no-files-found: error

  canary-publish:
    needs: canary-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The canary versions and built files from canary-build, over the
      # checked-out packages.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canary-packages
          path: packages

      - name: Publish canary
        # --no-git-tag: canaries get no git tags. The `canary` npm tag keeps
        # `latest` (what `npm install` gets) unchanged.
        run: pnpm changeset publish --tag canary --no-git-tag
        env:
          PNPM_CONFIG_PROVENANCE: "true"
          # `pnpm publish` would run the packages' lifecycle scripts
          # (prepack, prepublishOnly, ...) in the job that holds the OIDC
          # token. The packages have none; this keeps it that way.
          PNPM_CONFIG_IGNORE_SCRIPTS: "true"
