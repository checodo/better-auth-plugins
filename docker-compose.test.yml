# Databases for `pnpm test:db`: the concurrency tests of the waitlist and
# referral plugins on Postgres and MySQL, which (unlike SQLite) run
# requests in parallel. better-auth's `getTestInstance` connects to these
# exact addresses and credentials. Test data only; never expose the ports.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   TEST_DATABASE=postgres pnpm test:db
#   TEST_DATABASE=mysql pnpm test:db
#   docker compose -f docker-compose.test.yml down
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: better_auth
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d better_auth"]
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot_password"]
      interval: 2s
      timeout: 5s
      retries: 60
